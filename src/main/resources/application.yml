server:
  # Different default port from provider (8080) so both APIs can run at the same time locally.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: consumer

  docker:
    compose:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/consumer_db}
    username: ${SPRING_DATASOURCE_USERNAME:consumer_user} # environment variable configured in ide
    password: ${SPRING_DATASOURCE_PASSWORD:consumer_pass} # environment variable configured in ide

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # "update" is convenient in dev; switch to "validate"/"none" in production
      # and use a migration tool (Flyway/Liquibase) for the schema.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: ${spring.application.name}-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Base URL of the provider API this service consumes.
provider:
  api:
    base-url: ${PROVIDER_API_BASE_URL:http://localhost:8080}
    connect-timeout: 3000
    read-timeout: 5000
    client-id: ${PROVIDER_CLIENT_ID} # environment variable configured in ide
    client-secret: ${PROVIDER_CLIENT_SECRET} # environment variable configured in ide

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus

info:
  app: Consumer API