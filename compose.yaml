services:

  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=consumer_db'
      - 'MYSQL_USER=consumer_user'
      - 'MYSQL_PASSWORD=consumer_pass'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      # Different host port from provider's compose.yaml (3306) so both stacks
      # can run at the same time locally.
      - '3307:3306'
    # Without this, Spring Boot's Docker Compose Support may see the port open
    # (MySQL's entrypoint restarts the server after running init scripts) and try
    # to connect before the consumer_user/consumer_db are actually ready, causing
    # an intermittent "Access denied" on startup. This makes it wait for a real ping.
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Note: Spring Boot's Docker Compose Support doesn't create the Kafka connection
  # automatically today (no native "service connection"), unlike MySQL.
  # The bootstrap-servers in application.yml (localhost:9093) already matches the
  # port exposed here, so no extra configuration is needed.
  kafka:
    image: 'apache/kafka:latest'
    ports:
      # Different host port from provider's compose.yaml (9092) so both stacks
      # can run at the same time locally.
      - '9093:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9093'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'

  prometheus:
    image: 'prom/prometheus:latest'
    ports:
      # Different host port from provider's compose.yaml (9090) so both stacks
      # can run at the same time locally.
      - '9091:9090'
    volumes:
      - './src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: 'grafana/grafana:latest'
    ports:
      # Different host port from provider's compose.yaml (3000) so both stacks
      # can run at the same time locally.
      - '3001:3000'
    environment:
      - 'GF_SECURITY_ADMIN_USER=admin'
      - 'GF_SECURITY_ADMIN_PASSWORD=admin'
    volumes:
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - prometheus

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:8.11.0'
    environment:
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      # Different host port from provider's OpenSearch (9200) so both stacks
      # can run at the same time locally.
      - '9201:9200'
    volumes:
      - 'elasticsearch-data:/usr/share/elasticsearch/data'

  kibana:
    image: 'docker.elastic.co/kibana/kibana:8.11.0'
    environment:
      - 'ELASTICSEARCH_HOSTS=http://elasticsearch:9200'
    ports:
      # Different host port from provider's OpenSearch Dashboards (5601) so both
      # stacks can run at the same time locally.
      - '5602:5601'
    depends_on:
      - elasticsearch

  fluent-bit:
    image: 'fluent/fluent-bit:latest'
    volumes:
      - './logs:/var/log/consumer:ro'
      - './fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf'
      - './fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf'
    depends_on:
      - elasticsearch

volumes:
  grafana-data:
  elasticsearch-data: